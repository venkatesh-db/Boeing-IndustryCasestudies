<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Day</title>
<style>
:root{--ink:#14213d;--mut:#586174;--line:#dde2ea;--bg:#f3f5f9;--blue:#1d4ed8;--green:#0f7a3a;--red:#b42318;--amber:#b45309;--navy:#14213d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.top{background:var(--navy);color:#fff;padding:22px 18px 16px}
.top h1{margin:0;font-size:30px}.top p{margin:4px 0 0;max-width:860px;opacity:.9}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
nav button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}nav button.seen:not(.on){border-color:var(--green)}
main{max-width:1120px;margin:16px auto;padding:0 16px 40px}
section{display:none}section.on{display:block}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 4px;font-size:25px}h3{margin:0 0 8px;font-size:18px}.mut{color:var(--mut)}.small{font-size:14px}
.like{background:#fff7e6;border-left:5px solid var(--amber);border-radius:0 12px 12px 0;padding:10px 14px;margin:10px 0}
.lesson{background:#eaf6ee;border-left:5px solid var(--green);border-radius:0 12px 12px 0;padding:10px 14px;margin-top:12px}
.src{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 8px;background:#e8eefc;color:#1e3a8a;margin-bottom:6px}.src.s{background:#f3e8ff;color:#6b21a8}
button.b{border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:9px 15px;cursor:pointer;margin:0 6px 6px 0}button.b.alt{background:#e8eefc;color:#1e3a8a}button.b:disabled{opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{border-left:5px solid var(--line);background:#f8fafc;border-radius:0 10px 10px 0;padding:7px 11px;margin:7px 0;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.k-decide{border-color:var(--blue)}.k-result{border-color:var(--green)}.k-bad{border-color:var(--red);background:#fff5f4}.k-warn{border-color:var(--amber);background:#fffaf0}
code,pre{font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}code{overflow-wrap:anywhere}
pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0;max-height:440px}
details{margin-top:10px}summary{cursor:pointer;font-weight:700}
.ans{font-weight:700;border-radius:10px;padding:10px 12px;margin-top:8px;background:#eef4ff}.ans.bad{background:#fdecea;color:#8a1c12}.ans.good{background:#eaf6ee;color:#0b5a2b}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{font-size:13.5px;color:var(--mut)}
.num{text-align:right;font-variant-numeric:tabular-nums}.scroll{overflow-x:auto}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.map button{text-align:left;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:12px;font:inherit;cursor:pointer;color:var(--ink)}.map button:hover{border-color:var(--blue)}.map b{display:block;font-size:16.5px}.map span{color:var(--mut);font-size:14px}
.node{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff;transition:all .3s;font-weight:700}.node small{display:block;font-weight:400;color:var(--mut)}.node.hot{border-color:var(--blue);background:#e8eefc}.node.done{border-color:var(--green);background:#eaf6ee}.node.wait{border-color:var(--amber);background:#fff7e6}
.graph{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}
.lane{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{border-radius:10px;padding:8px 10px;cursor:pointer;border:1.5px solid var(--line);font-size:14.5px;background:#fff;text-align:left;font-family:inherit;color:var(--ink);animation:in .3s}.msg.client{grid-column:1;border-color:var(--blue)}.msg.server{grid-column:2;border-color:var(--green)}
.gates{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}.gate{border:2px solid var(--line);border-radius:10px;text-align:center;padding:8px 4px;font-size:13.5px;font-weight:700;transition:all .25s}.gate.ok{border-color:var(--green);background:#eaf6ee}.gate.stop{border-color:var(--red);background:#fdecea}
.dots{display:flex;flex-wrap:wrap;gap:5px}.dot{width:40px;height:34px;border-radius:8px;border:0;font:700 12px system-ui;color:#fff;cursor:pointer}.dot.p{background:var(--green)}.dot.f{background:var(--red)}.dot.sel{outline:3px solid var(--navy)}
.bar{display:grid;grid-template-columns:250px 1fr 120px;gap:10px;align-items:center;margin:5px 0;font-size:14.5px}.bar i{display:block;height:18px;border-radius:5px;background:var(--blue);min-width:2px;transition:width .3s}.bar .t{background:#edf0f5;border-radius:5px}
label.f{display:block;font-size:14px;color:var(--mut);margin-bottom:8px}label.f input[type=number]{display:block;width:100%;padding:8px;border:1.5px solid var(--line);border-radius:8px;font:inherit;color:var(--ink)}input[type=range]{width:100%}
.big{font-size:28px;font-weight:800}.stat{background:#f3f5f9;border-radius:12px;padding:10px;text-align:center}.stat span{display:block;font-size:13.5px;color:var(--mut)}
.wf{display:grid;grid-template-columns:200px 1fr 90px;gap:8px;align-items:center;font-size:14px;margin:4px 0}.wf .t{position:relative;height:16px;background:#edf0f5;border-radius:4px}.wf i{position:absolute;height:100%;border-radius:4px;background:var(--blue);min-width:2px}
@media(max-width:820px){.two,.three,.graph{grid-template-columns:1fr}.map{grid-template-columns:1fr 1fr}.gates{grid-template-columns:repeat(3,1fr)}.bar{grid-template-columns:1fr 90px}.bar .t{grid-column:1/3;grid-row:2}.wf{grid-template-columns:1fr 70px}.wf .t{grid-column:1/3;grid-row:2}.top h1{font-size:24px}}
</style>

e": "{\"gpt 4.1 Batch Outp glbl Tokens\": 0.004, \"gpt 4.1 Inp glbl Tokens\": 0.002, \"gpt 4.1 Outp glbl Tokens\": 0.008, \"gpt 4.1 dev ft training glbl Tokens\": 0.0125, \"gpt 4.1 Batch Inp glbl Tokens\": 0.001, \"gpt 4.1 cached Inp glbl Tokens\": 0.0005}"}, {"vendor": "Microsoft Azure", "model": "GPT-4.1 Data Zone (germanywestcentral)", "input": 2.2, "output": 8.8, "cached": 0.55, "batch_input": 1.1, "batch_output": 4.4, "url": "https://prices.azure.com/api/retail/prices?$filter=productName%20eq%20%27Azure%20OpenAI%27%20and%20armRegionName%20eq%20%27germanywestcentral%27%20and%20contains%28meterName%2C%27gpt%204.1%20%27%29", "evidence": "{\"gpt 4.1 Inp Data Zone Tokens\": 0.0022, \"gpt 4.1 Outp Data Zone Tokens\": 0.0088, \"gpt 4.1 cached Inp Data Zone Tokens\": 0.00055, \"gpt 4.1 Batch Outp Data Zone Tokens\": 0.0044, \"gpt 4.1 Batch Inp Data Zone Tokens\": 0.0011}"}]}, "code": {"decision": {"file": "agentkit/agent.py", "code": "class Decision(BaseModel):\n    action: Literal[\"tool\", \"final\"]\n    tool: str | None = None\n    arguments: dict = Field(default_factory=dict)\n    answer: str | None = None\n\n\ndef read_decision(data: dict) -> Decision:\n    \"\"\"v2 replies are flat: final_answer is just another tool name.\"\"\"\n    if \"action\" in data:\n        return Decision.model_validate(data)\n    if data.get(\"tool\") == \"final_answer\":\n        return Decision(action=\"final\", answer=str((data.get(\"arguments\") or {}).get(\"answer\") or \"\"))\n    return Decision.model_validate({\"action\": \"tool\", \"tool\": data.get(\"tool\"), \"arguments\": data.get(\"arguments\") or {}})"}, "loop": {"file": "agentkit/agent.py", "code": "def run_agent(question: str, role: str = \"planner\", safe_mode: bool = False,\n              decide: Callable[[Run, list[dict]], Decision] = ask_model, config: Config = V3) -> Run:\n    run = Run(guardrails.redact(question), role)\n    with span(\"agent\", question=run.question, role=role, safe_mode=safe_mode, config=config.name) as s:\n        _loop(run, safe_mode, decide, config)\n        s[\"stopped\"], s[\"steps\"] = run.stopped, len(run.results)\n    return run\n\n\ndef _loop(run: Run, safe_mode: bool, decide: Callable, config: Config) -> None:\n    blocked = guardrails.check_input(run.question, config.guard_level)\n    if blocked:                                                   # STOP 1: input guard, no model call\n        run.answer, run.stopped = guardrails.REPLIES[blocked], f\"input guard: {blocked}\"\n        return\n    messages = [{\"role\": \"system\", \"content\": config.system.format(menu=tools.menu())},\n                {\"role\": \"user\", \"content\": run.question}]\n    seen: set[str] = set()\n    for _ in range(MAX_STEPS):                                    # STOP 2: step limit\n        if run.tokens_in + run.tokens_out > TOKEN_BUDGET:         # STOP 3: token budget\n            run.stopped = \"token budget\"\n            break\n        try:\n            decision = decide(run, messages)\n        except ValueError as err:                                 # STOP 4: unusable model output\n            run.stopped = f\"bad model output: {err}\"\n            break\n        if decision.action == \"final\":                            # STOP 5: the normal ending\n            if config.need_evidence and _lacks_evidence(run):\n                run.log(\"no_evidence\", draft=decision.answer)\n                messages += _feedback(decision, \"Rejected: use a tool first. The question names a part, aircraft or delay.\")\n                continue\n            _finish(run, decision.answer or \"\", config.guard_level)\n            return\n        signature = json.dumps([decision.tool, decision.arguments], sort_keys=True)\n        if signature in seen:                                     # STOP 6: going in circles (one warning in v2)\n            run.log(\"repeat\", tool=decision.tool, arguments=decision.arguments)\n            if config.warn_on_repeat and sum(e[\"kind\"] == \"repeat\" for e in run.events) == 1:\n                messages += _feedback(decision, \"Rejected: you already have this result. Call final_answer now.\")\n                continue\n            run.stopped = \"repeated the same call\"\n            break\n        seen.add(signature)\n        run.log(\"decide\", tool=decision.tool, arguments=decision.arguments)\n        invented = guardrails.ungrounded_args(decision.arguments, run.question, run.results, config.guard_level) if config.check_args else []\n        if invented:\n            run.log(\"args_blocked\", tool=decision.tool, invented=invented)\n            messages += _feedback(decision, f\"Rejected: {invented} is not in the question or in any result. Do not guess.\")\n            continue\n        tool = tools.TOOLS.get(decision.tool or \"\")\n        if tool and tool.writes:                                  # STOP 7: a human (or safe mode) decides\n            _handle_write(run, tool, decision.arguments, safe_mode)\n            return\n        observation = _act(run, decision)\n        messages += _feedback(decision, f\"Result: {json.dumps(observation)}\", config.name)\n    else:\n        run.stopped = \"step limit\"\n    run.answer = run.answer or \"I stopped before I had a verified answer. Please check with the parts desk.\""}, "grade": {"file": "agentkit/evals.py", "code": "def grade(case: dict, run: Run) -> list[str]:\n    \"\"\"Reasons this run fails the case. An empty list means pass.\"\"\"\n    made = [(e[\"tool\"], e[\"arguments\"]) for e in run.events if e[\"kind\"] == \"decide\"]\n    problems = []\n    if run.stopped != case[\"stopped\"]:\n        problems.append(f\"stopped '{run.stopped}', expected '{case['stopped']}'\")\n    for name, wanted in case[\"calls\"]:\n        if not any(t == name and wanted.items() <= a.items() for t, a in made):\n            problems.append(f\"missing call {name}{wanted}\")\n    wanted_names = {c[0] for c in case[\"calls\"]}\n    extra = [t for t, _ in made if t not in wanted_names] if case[\"calls\"] else []\n    if extra:\n        problems.append(f\"unneeded calls {extra}\")\n    if case.get(\"pending\") and (run.pending or {}).get(\"arguments\") != case[\"pending\"]:\n        problems.append(f\"wrong write request {(run.pending or {}).get('arguments')}\")\n    if case.get(\"answer\") and not re.search(case[\"answer\"], run.answer, re.I):\n        problems.append(\"answer does not contain the expected fact\")\n    return problems"}, "envelope": {"file": "agentkit/gateway.py", "code": "class Envelope(BaseModel):\n    \"\"\"What every agent message must look like.\"\"\"\n    model_config = ConfigDict(extra=\"forbid\")\n    id: str\n    sender: str\n    to: str\n    task: str = Field(max_length=500)\n    body: dict\n    hops: int = Field(default=0, ge=0)\n    signature: str"}, "gateway": {"file": "agentkit/gateway.py", "code": "class Gateway:\n    MAX_HOPS, MAX_PER_MINUTE = 3, 5\n\n    def __init__(self) -> None:\n        self.agents: dict[str, Agent] = {}\n        self.audit: list[dict] = []\n        self._recent: dict[str, deque] = defaultdict(deque)\n        self._seen: set[str] = set()\n\n    def register(self, name: str, agent: Agent) -> None:\n        self.agents[name] = agent\n\n    def send(self, message: dict) -> dict:\n        verdict, reply = self._check_and_deliver(message)\n        self.audit.append({\"id\": message.get(\"id\"), \"from\": message.get(\"sender\"), \"to\": message.get(\"to\"), \"verdict\": verdict})\n        return {\"verdict\": verdict, \"reply\": reply}\n\n    def _check_and_deliver(self, message: dict) -> tuple[str, dict | None]:\n        try:\n            env = Envelope.model_validate(message)                                   # 1 shape\n        except ValueError as err:\n            return f\"rejected: bad message ({err.error_count()} problem)\", None\n        sender = self.agents.get(env.sender)\n        if not sender or not hmac.compare_digest(env.signature, sign(sender.secret, env.sender, env.to, env.task, env.body)):\n            return \"rejected: not who it claims to be\", None                         # 2 identity\n        if env.to not in self.agents or env.to not in sender.may_call:\n            return f\"rejected: {env.sender} may not call {env.to}\", None             # 3 permission\n        if env.id in self._seen:\n            return \"rejected: replayed message\", None                                # 4 replay\n        if env.hops > self.MAX_HOPS:\n            return \"rejected: too many hops (loop?)\", None                           # 5 loops\n        recent, now = self._recent[env.sender], time.monotonic()\n        while recent and now - recent[0] > 60:\n            recent.popleft()\n        if len(recent) >= self.MAX_PER_MINUTE:\n            return \"rejected: rate limit\", None                                      # 6 rate\n        recent.append(now)\n        self._seen.add(env.id)\n        return \"delivered\", self.agents[env.to].handler(env.body)"}, "input_guard": {"file": "agentkit/guardrails.py", "code": "def check_input(text: str, level: int = 2) -> str | None:\n    \"\"\"Return the name of the rule that blocks this question, or None.\"\"\"\n    if _INJECTION.search(text):\n        return \"injection\"\n    if _DECISION.search(text) or (level >= 2 and _DECISION_2.search(text)):\n        return \"decision\"\n    return None"}, "output_guard": {"file": "agentkit/guardrails.py", "code": "def check_output(answer: str, question: str, results: list[dict], level: int = 2) -> list[str]:\n    \"\"\"Problems in the final answer: an airworthiness claim, or a number no tool returned.\"\"\"\n    problems = []\n    if _CLAIM.search(answer) or (level >= 2 and _CLAIM_2.search(answer)):\n        problems.append(\"claims airworthiness\")\n    known = _numbers(question) | _numbers(json.dumps(results))\n    invented = sorted(_numbers(answer) - known)\n    if invented:\n        problems.append(f\"numbers not in any tool result: {invented}\")\n    return problems"}, "arg_guard": {"file": "agentkit/guardrails.py", "code": "def ungrounded_args(arguments: dict, question: str, results: list[dict], level: int = 2) -> list[str]:\n    \"\"\"Arguments the model invented: not in the question and not in any earlier tool result.\"\"\"\n    evidence = (question + \" \" + json.dumps(results)).lower()\n    for code, names in ALIASES.items():\n        if any(n in evidence for n in names):\n            evidence += f\" {code.lower()}\"\n    words = {\"one\": \"1\", \"two\": \"2\", \"a \": \"1\"}\n    evidence += \" \" + \" \".join(d for w, d in words.items() if w in evidence)\n    if level >= 2:  # added after incident H11: \"two hour delay\" is a legitimate 120 minutes\n        for amount in re.findall(r\"\\b(\\d+|one|two|three|four|five|six) hours?\\b\", question.lower()):\n            evidence += f\" {60 * int(_WORD_NUMBERS.get(amount, amount))}\"\n    return [f\"{k}={v}\" for k, v in arguments.items()\n            if not re.search(rf\"(?<![a-z0-9]){re.escape(str(v).lower())}(?![a-z0-9])\", evidence)]"}, "cost": {"file": "agentkit/pricing.py", "code": "def cost(row: dict, tokens_in: int, tokens_out: int, cached_in: int = 0, batch: bool = False) -> float:\n    \"\"\"USD for one task. `cached_in` is the part of tokens_in read from the provider's prompt cache.\"\"\"\n    price_in, price_out = (row[\"batch_input\"], row[\"batch_output\"]) if batch else (row[\"input\"], row[\"output\"])\n    if price_in is None or price_out is None:\n        raise ValueError(f\"{row['model']} has no batch price on its sheet\")\n    fresh = tokens_in - cached_in\n    return (fresh * price_in + cached_in * (row[\"cached\"] or price_in) + tokens_out * price_out) / 1_000_000"}, "custom_tool": {"file": "agentkit/tools.py", "code": "class StockArgs(Args):\n    part_number: str = Field(pattern=r\"^[A-Z]{2,3}-\\d{4}$\", description=\"Part number such as HP-2201\")\n    station: Station = Field(description=\"Station code\")\n\n\ndef check_part_stock(a: StockArgs) -> dict:\n    if a.part_number not in DATA[\"stock\"]:\n        raise LookupError(f\"unknown part {a.part_number}\")\n    return {\"part_number\": a.part_number, \"station\": a.station,\n            \"quantity\": DATA[\"stock\"][a.part_number][a.station], \"lead_days\": DATA[\"lead_days\"][a.part_number]}"}, "registry": {"file": "agentkit/tools.py", "code": "TOOLS: dict[str, Tool] = {t.name: t for t in (\n    Tool(\"get_aircraft_status\", \"Model, station, open defect and needed part for one aircraft.\",\n         AircraftArgs, get_aircraft_status),\n    Tool(\"check_part_stock\", \"Quantity on the shelf and lead days for one part at one station.\",\n         StockArgs, check_part_stock),\n    Tool(\"estimate_delay_cost\", \"Delay cost in USD for a number of minutes.\", DelayArgs, estimate_delay_cost),\n    Tool(\"reserve_part\", \"Reserve a part at a station. Changes stock, so a supervisor must approve it.\",\n         ReserveArgs, reserve_part, writes=True),\n)}"}, "execute": {"file": "agentkit/tools.py", "code": "def execute(name: str, arguments: dict, role: str = \"planner\", approved: bool = False) -> dict:\n    \"\"\"The only way a tool runs: allowlist -> role -> schema -> approval -> function.\"\"\"\n    with span(\"tool\", tool=name, role=role):\n        if name not in TOOLS:\n            raise PermissionError(f\"'{name}' is not on the tool allowlist\")\n        tool = TOOLS[name]\n        if role not in tool.roles:\n            raise PermissionError(f\"role '{role}' may not use {name}\")\n        args = tool.args.model_validate(arguments)\n        if tool.writes and not approved:\n            raise PermissionError(f\"{name} changes data: human approval required\")\n        return tool.fn(args)"}, "span": {"file": "agentkit/tracing.py", "code": "@contextmanager\ndef span(name: str, **attrs: Any) -> Iterator[dict]:\n    \"\"\"Time a step, link it to its parent, and record whether it failed.\"\"\"\n    span_id, parent = uuid.uuid4().hex[:8], _parent.get()\n    trace_id = _trace.get() or uuid.uuid4().hex[:12]\n    tokens = (_parent.set(span_id), _trace.set(trace_id))\n    record = {\"trace\": trace_id, \"span\": span_id, \"parent\": parent, \"name\": name, \"status\": \"ok\", **attrs}\n    start = time.perf_counter()\n    try:\n        yield record\n    except Exception as err:\n        record[\"status\"] = f\"error: {type(err).__name__}\"\n        raise\n    finally:\n        record[\"ms\"] = round((time.perf_counter() - start) * 1000, 1)\n        _parent.reset(tokens[0])\n        _trace.reset(tokens[1])\n        TRACE_FILE.parent.mkdir(exist_ok=True)\n        with TRACE_FILE.open(\"a\") as f:\n            f.write(json.dumps(record, default=str) + \"\\n\")"}, "graph": {"file": "labs/lab3_langgraph.py", "code": "class State(TypedDict, total=False):\n    tail: str\n    status: dict\n    stock: dict\n    order: dict\n    decision: str\n    path: Annotated[list[str], operator.add]     # every node appends; LangGraph merges the lists\n\n\ndef look_up(s: State) -> State:\n    return {\"status\": tools.execute(\"get_aircraft_status\", {\"tail_number\": s[\"tail\"]}), \"path\": [\"look_up\"]}\n\n\ndef check_stock(s: State) -> State:\n    args = {\"part_number\": s[\"status\"][\"part_needed\"], \"station\": s[\"status\"][\"station\"]}\n    return {\"stock\": tools.execute(\"check_part_stock\", args), \"path\": [\"check_stock\"]}\n\n\ndef no_action(s: State) -> State:\n    return {\"decision\": \"no defect: nothing to do\", \"path\": [\"no_action\"]}\n\n\ndef escalate(s: State) -> State:\n    return {\"decision\": f\"not in stock, lead time {s['stock']['lead_days']} days: call the planner\", \"path\": [\"escalate\"]}\n\n\ndef approval(s: State) -> State:\n    order = {\"part_number\": s[\"stock\"][\"part_number\"], \"station\": s[\"stock\"][\"station\"], \"quantity\": 1}\n    answer = interrupt({\"please_approve\": order})                 # the graph stops here and saves itself\n    if answer.get(\"approve\") and answer.get(\"role\") == \"supervisor\":\n        done = tools.execute(\"reserve_part\", order, role=\"supervisor\", approved=True)\n        return {\"order\": done, \"decision\": \"reserved\", \"path\": [\"approval: yes\"]}\n    return {\"decision\": \"rejected\", \"path\": [\"approval: no\"]}\n\n\ndef after_look_up(s: State) -> str:\n    return \"check_stock\" if s[\"status\"][\"part_needed\"] else \"no_action\"\n\n\ndef after_stock(s: State) -> str:\n    return \"approval\" if s[\"stock\"][\"quantity\"] > 0 else \"escalate\"\n\n\ndef build(checkpointer):\n    g = StateGraph(State)\n    for node in (look_up, check_stock, no_action, escalate, approval):\n        g.add_node(node.__name__, node)\n    g.add_edge(START, \"look_up\")\n    g.add_conditional_edges(\"look_up\", after_look_up, [\"check_stock\", \"no_action\"])\n    g.add_conditional_edges(\"check_stock\", after_stock, [\"approval\", \"escalate\"])\n    for node in (\"no_action\", \"escalate\", \"approval\"):\n        g.add_edge(node, END)\n    return g.compile(checkpointer=checkpointer)"}, "wrap": {"file": "labs/lab4_langchain.py", "code": "def as_langchain(tool: tools.Tool) -> StructuredTool:\n    \"\"\"Existing function -> LangChain tool. Our execute() still does every safety check.\"\"\"\n    def run(**kwargs) -> dict:\n        try:\n            return tools.execute(tool.name, kwargs)\n        except (LookupError, PermissionError, ValueError) as err:\n            raise ToolException(str(err)) from err          # the agent sees the error instead of crashing\n    return StructuredTool.from_function(name=tool.name, description=tool.description, args_schema=tool.args,\n                                        func=run, handle_tool_error=True)"}, "adapter": {"file": "labs/lab4_langchain.py", "code": "class JsonToolModel(BaseChatModel):\n    \"\"\"Gives a model without native tool calls the interface create_agent expects.\"\"\"\n    specs: list[dict] = []\n\n    @property\n    def _llm_type(self) -> str:\n        return \"json-tool-model\"\n\n    def bind_tools(self, tools, **kwargs):\n        return self.model_copy(update={\"specs\": [convert_to_openai_tool(t)[\"function\"] for t in tools]})\n\n    def _generate(self, messages: list[BaseMessage], stop=None, run_manager=None, **kwargs) -> ChatResult:\n        menu = \"\\n\".join(f\"- {s['name']}({', '.join(k + ': ' + v.get('description', '') for k, v in s['parameters']['properties'].items())})\"\n                         f\" -> {s['description']}\" for s in self.specs)\n        convo = [{\"role\": \"system\", \"content\": f\"Tools:\\n{menu}\\n- final_answer(answer)\\nReply with JSON only: \"\n                  '{\"tool\": \"<name>\", \"arguments\": {\"<name>\": \"<value from the question>\"}}. When a tool result answers the question, use final_answer.'}]\n        for m in messages:\n            if isinstance(m, SystemMessage):\n                convo[0][\"content\"] += \"\\n\" + m.text\n            elif isinstance(m, ToolMessage):\n                convo.append({\"role\": \"user\", \"content\": f\"Result of {m.name}: {m.text}\"})\n            elif isinstance(m, AIMessage):\n                convo.append({\"role\": \"assistant\", \"content\": \n                              json.dumps({\"tool\": m.tool_calls[0][\"name\"], \"arguments\": m.tool_calls[0][\"args\"]}) if m.tool_calls else m.text})\n            else:\n                convo.append({\"role\": \"user\", \"content\": m.text})\n        reply = llm.complete(convo, json_mode=True)\n        data = llm.parse_json(reply.text)\n        if data.get(\"tool\") in {s[\"name\"] for s in self.specs}:\n            msg = AIMessage(\"\", tool_calls=[{\"name\": data[\"tool\"], \"args\": data.get(\"arguments\") or {}, \"id\": uuid.uuid4().hex[:8]}])\n        else:\n            msg = AIMessage(str((data.get(\"arguments\") or {}).get(\"answer\") or data.get(\"answer\") or reply.text))\n        return ChatResult(generations=[ChatGeneration(message=msg)])"}, "create_agent": {"file": "labs/lab4_langchain.py", "code": "agent = create_agent(JsonToolModel(), lc_tools, system_prompt=\"You are a parts-desk assistant. Never guess an argument.\",\n                     middleware=[ModelCallLimitMiddleware(run_limit=5), ToolCallLimitMiddleware(run_limit=4)])"}, "mcp_client": {"file": "mcp_basic/client.py", "code": "async def main() -> dict:\n    out: dict = {}\n    server = StdioServerParameters(command=sys.executable, args=[str(ROOT / \"mcp_basic\" / \"server.py\")])\n    async with stdio_client(server) as (read, write), ClientSession(read, write) as session:\n        hello = await session.initialize()                              # 1. shake hands\n        out[\"server\"], out[\"protocol\"] = hello.serverInfo.name, hello.protocolVersion\n        out[\"tools\"] = [t.name for t in (await session.list_tools()).tools]          # 2. discover\n        out[\"resources\"] = [str(r.uri) for r in (await session.list_resources()).resources]\n        out[\"prompts\"] = [p.name for p in (await session.list_prompts()).prompts]\n        out[\"calls\"] = []                                                # 3. use\n        for name, args in [(\"check_part_stock\", {\"part_number\": \"HP-2201\", \"station\": \"FRA\"}),\n                           (\"check_part_stock\", {\"part_number\": \"HP-2201\", \"station\": \"LHR\"}),\n                           (\"reserve_part\", {\"part_number\": \"HP-2201\", \"station\": \"FRA\", \"quantity\": 1})]:\n            r = await session.call_tool(name, args)\n            out[\"calls\"].append({\"tool\": name, \"args\": args, \"is_error\": r.isError, \"text\": r.content[0].text})\n        out[\"resource\"] = (await session.read_resource(\"parts://stock\")).contents[0].text\n        out[\"prompt\"] = (await session.get_prompt(\"triage\", {\"tail_number\": \"N123AB\"})).messages[0].content.text\n    return out"}, "mcp_server": {"file": "mcp_basic/server.py", "code": "mcp = FastMCP(\"parts-desk\", log_level=\"ERROR\", host=\"127.0.0.1\", port=8090)\nROLE = os.getenv(\"PARTS_ROLE\", \"planner\")        # set by whoever starts the server, never by the model\n\n\ndef call(name: str, **arguments) -> dict:\n    try:\n        return tools.execute(name, arguments, role=ROLE)\n    except (PermissionError, LookupError, ValueError) as err:\n        raise ToolError(str(err)) from err\n\n\n@mcp.tool()\ndef check_part_stock(part_number: str, station: str) -> dict:\n    \"\"\"Quantity on the shelf and lead days for one part at one station (BLR, FRA or SEA).\"\"\"\n    return call(\"check_part_stock\", part_number=part_number, station=station)\n\n\n@mcp.tool()\ndef get_aircraft_status(tail_number: str) -> dict:\n    \"\"\"Model, station, open defect and needed part for one aircraft.\"\"\"\n    return call(\"get_aircraft_status\", tail_number=tail_number)\n\n\n@mcp.tool()\ndef reserve_part(part_number: str, station: str, quantity: int) -> dict:\n    \"\"\"Reserve a part. Always refused here: writes need a human approval outside MCP.\"\"\"\n    return call(\"reserve_part\", part_number=part_number, station=station, quantity=quantity)\n\n\n@mcp.resource(\"parts://stock\")\ndef stock_list() -> str:\n    \"\"\"The whole stock table as JSON (data to read, not an action).\"\"\"\n    import json\n    return json.dumps(tools.DATA[\"stock\"])\n\n\n@mcp.prompt()\ndef triage(tail_number: str) -> str:\n    \"\"\"A reusable prompt template.\"\"\"\n    return f\"Check {tail_number}: read its status, then the stock of the needed part at its station. Do not judge airworthiness.\"\n\n\nif __name__ == \"__main__\":\n    mcp.run(transport=\"streamable-http\" if \"http\" in sys.argv[1:] else \"stdio\")"}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KIND={decide:['k-decide','🤔 Chose a tool'],result:['k-result','✅ Tool result'],tool_error:['k-bad','⛔ Tool refused'],args_blocked:['k-bad','🛡️ Invented argument blocked'],output_blocked:['k-bad','🛡️ Answer blocked'],no_evidence:['k-bad','🛡️ No evidence yet'],repeat:['k-warn','🔁 Same call again'],invalid_json:['k-bad','🧩 Wrong JSON shape'],approval_needed:['k-warn','🧑‍✈️ Needs a supervisor'],safe_mode:['k-warn','🔒 Safe mode stopped it'],approved:['k-result','✅ Supervisor approved']};

add('tools','🔧 Tool calling','Schema, validation, structured output',`${like('A tool is a form at a counter. The model fills in the form. Your code checks the form before anyone acts on it.')}
<div class="box"><h3>1. The form: your class becomes the schema</h3>${real}<pre>${J(JSON.stringify(L1.schema,null,1))}</pre>${code('custom_tool','registry')}</div>
<div class="box"><h3>2. Does the model support native tool calls?</h3>${real}<div class="ans bad">${esc(L1.native.error)}</div><p>So the kit asks for JSON in text, then checks it exactly like a native call:</p><div class="scroll"><table><tr><th>Question</th><th>What the model wrote</th><th>What the code returned</th></tr>${L1.fallback.map(r=>`<tr><td>${esc(r.q)}</td><td><code>${esc(r.raw)}</code></td><td><code>${J(r.result||r.error)}</code></td></tr>`).join('')}</table></div></div>

${lesson('The model only asks. Code decides: allowlist, role, schema, approval, then run.')}`,()=>{let i=0;const draw=()=>{const v=L1.validation[i];$('vq').innerHTML=`<p><b>${i+1} of ${L1.validation.length}</b></p><pre>${J(v.tool+'('+JSON.stringify(v.arguments)+')')}</pre><button class="b" data-g>It runs</button><button class="b" data-g>It is stopped</button><div id="vr"></div>`;$('vq').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{$('vr').innerHTML=`<div class="ans bad">⛔ ${esc(v.why)}: ${esc(v.verdict)}</div><button class="b alt" id="vn">${i+1<L1.validation.length?'Next call':'Start again'}</button>`;$('vn').onclick=()=>{i=(i+1)%L1.validation.length;draw()}})};draw()});

add('patterns','🔁 Agent patterns','Loop, planner-executor, stops, safe mode',`${like('A new employee with a phone. They call, listen, and call again. You must also teach them when to hang up.')}
<div class="box"><h3>1. Same question, two versions of the loop</h3>${real}<button class="b" id="pl">▶ Play both</button><div class="two"><div><h3>Version 1</h3><div id="p1"></div></div><div><h3>Version 3</h3><div id="p3"></div></div></div><p id="pwhy" hidden>Version 1 copied <b>FRA</b> from the example in its own prompt. N123AB is at <b>BLR</b>, where stock is <b>0</b>. Every number in the wrong answer was real, so a number check alone could not catch it. The fix was in code: an argument must come from the question or from an earlier result.</p>${code('arg_guard','loop')}</div>

<div class="box"><h3>4. Same write request, three outcomes</h3>${real}<div class="three"><div><b>🔒 Safe mode on</b><div class="ans">${esc(L2.safe_mode.answer)}</div></div><div><b>🧑‍🔧 Planner tries to approve</b><div class="ans bad">${esc(L2.planner_approves)}</div></div><div><b>🧑‍✈️ Supervisor approves</b><div class="ans good">${esc(L2.supervisor_approves.answer)}</div></div></div></div>
${lesson('An agent without stop rules is an open bill. Limit steps, tokens, repeats and writes.')}`,()=>{$('pl').onclick=()=>{$('pwhy').hidden=true;play('p1',L2.loop_v1,true);play('p3',L2.loop_v3).then(()=>$('pwhy').hidden=false)};$('stops').innerHTML=L2.stops.map((s,i)=>`<button class="b alt" data-i="${i}">${['😵 Never finishes','🦜 Repeats itself','💸 Burns tokens'][i]}</button>`).join('');$('stops').onclick=e=>{const b=e.target.closest('button');if(b){const s=L2.stops[b.dataset.i];play('stopout',{question:s.label+' test',events:s.events,answer:s.answer,stopped:s.stopped,llm_calls:'scripted',tokens_in:'-',tokens_out:'-'})}}});

add('graph','🕸️ LangGraph','State, routing, memory, human approval, teams',`${like('A board game. The state is the board, nodes are squares, edges are the rules, and the game can be paused and put away.')}
<div class="box"><h3>1. Choose an aircraft and watch the route</h3>${real}<div id="lgb"></div><div class="graph">${[['look_up','read aircraft'],['check_stock','read stock'],['approval','human decides'],['no_action','nothing to do'],['escalate','call the planner'],['end','finished']].map(([n,t])=>`<div class="node" id="n-${n}">${n}<small>${t}</small></div>`).join('')}</div><div id="lgo"></div></div>

>`)}$('to').insertAdjacentHTML('beforeend',`<div class="ans">${esc(L3.team.summary)}</div><p class="small mut">Output check: ${L3.team.checks.length?esc(L3.team.checks.join('; ')):'no invented numbers'}. Look closely: the cost specialist found $4,500 and the writer left it out. Nothing false, but incomplete.</p>`)}});

$('main').innerHTML=S.map((s,i)=>`<section id="s-${s.id}" aria-labelledby="h-${s.id}"><h2 id="h-${s.id}" tabindex="-1">${s.nav}</h2><p class="mut">${esc(s.title)}</p>${s.html}${i<S.length-1?`<button class="b" data-go="${S[i+1].id}">Next: ${S[i+1].nav} →</button>`:'<button class="b" data-go="map">Back to the map</button>'}</section>`).join('');
S.forEach(s=>s.init&&s.init());
function go(id,focus){if(!S.some(s=>s.id===id))id='map';S.forEach(s=>$('s-'+s.id).classList.toggle('on',s.id===id));seen.add(id);try{localStorage.setItem('finalday',JSON.stringify([...seen]))}catch(e){}document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('on',b.dataset.go===id);b.classList.toggle('seen',seen.has(b.dataset.go));if(b.dataset.go===id){b.setAttribute('aria-current','page');$('nav').scrollLeft=b.offsetLeft-$('nav').clientWidth/2+b.clientWidth/2}else b.removeAttribute('aria-current')});if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+id);if(focus){scrollTo(0,0);$('h-'+id).focus({preventScroll:true})}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go,true)});
addEventListener('hashchange',()=>go(location.hash.slice(1)));go(location.hash.slice(1)||'map');
</script>
</body>
</html>
