<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Day</title>
<style>
:root{--ink:#14213d;--mut:#586174;--line:#dde2ea;--bg:#f3f5f9;--blue:#1d4ed8;--green:#0f7a3a;--red:#b42318;--amber:#b45309;--navy:#14213d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.top{background:var(--navy);color:#fff;padding:22px 18px 16px}
.top h1{margin:0;font-size:30px}.top p{margin:4px 0 0;max-width:860px;opacity:.9}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
nav button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}nav button.seen:not(.on){border-color:var(--green)}
main{max-width:1120px;margin:16px auto;padding:0 16px 40px}
section{display:none}section.on{display:block}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 4px;font-size:25px}h3{margin:0 0 8px;font-size:18px}.mut{color:var(--mut)}.small{font-size:14px}
.like{background:#fff7e6;border-left:5px solid var(--amber);border-radius:0 12px 12px 0;padding:10px 14px;margin:10px 0}
.lesson{background:#eaf6ee;border-left:5px solid var(--green);border-radius:0 12px 12px 0;padding:10px 14px;margin-top:12px}
.src{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 8px;background:#e8eefc;color:#1e3a8a;margin-bottom:6px}.src.s{background:#f3e8ff;color:#6b21a8}
button.b{border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:9px 15px;cursor:pointer;margin:0 6px 6px 0}button.b.alt{background:#e8eefc;color:#1e3a8a}button.b:disabled{opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{border-left:5px solid var(--line);background:#f8fafc;border-radius:0 10px 10px 0;padding:7px 11px;margin:7px 0;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.k-decide{border-color:var(--blue)}.k-result{border-color:var(--green)}.k-bad{border-color:var(--red);background:#fff5f4}.k-warn{border-color:var(--amber);background:#fffaf0}
code,pre{font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}code{overflow-wrap:anywhere}
pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0;max-height:440px}
details{margin-top:10px}summary{cursor:pointer;font-weight:700}
.ans{font-weight:700;border-radius:10px;padding:10px 12px;margin-top:8px;background:#eef4ff}.ans.bad{background:#fdecea;color:#8a1c12}.ans.good{background:#eaf6ee;color:#0b5a2b}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{font-size:13.5px;color:var(--mut)}
.num{text-align:right;font-variant-numeric:tabular-nums}.scroll{overflow-x:auto}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.map button{text-align:left;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:12px;font:inherit;cursor:pointer;color:var(--ink)}.map button:hover{border-color:var(--blue)}.map b{display:block;font-size:16.5px}.map span{color:var(--mut);font-size:14px}
.node{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff;transition:all .3s;font-weight:700}.node small{display:block;font-weight:400;color:var(--mut)}.node.hot{border-color:var(--blue);background:#e8eefc}.node.done{border-color:var(--green);background:#eaf6ee}.node.wait{border-color:var(--amber);background:#fff7e6}
.graph{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}
.lane{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{border-radius:10px;padding:8px 10px;cursor:pointer;border:1.5px solid var(--line);font-size:14.5px;background:#fff;text-align:left;font-family:inherit;color:var(--ink);animation:in .3s}.msg.client{grid-column:1;border-color:var(--blue)}.msg.server{grid-column:2;border-color:var(--green)}
.gates{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}.gate{border:2px solid var(--line);border-radius:10px;text-align:center;padding:8px 4px;font-size:13.5px;font-weight:700;transition:all .25s}.gate.ok{border-color:var(--green);background:#eaf6ee}.gate.stop{border-color:var(--red);background:#fdecea}
.dots{display:flex;flex-wrap:wrap;gap:5px}.dot{width:40px;height:34px;border-radius:8px;border:0;font:700 12px system-ui;color:#fff;cursor:pointer}.dot.p{background:var(--green)}.dot.f{background:var(--red)}.dot.sel{outline:3px solid var(--navy)}
.bar{display:grid;grid-template-columns:250px 1fr 120px;gap:10px;align-items:center;margin:5px 0;font-size:14.5px}.bar i{display:block;height:18px;border-radius:5px;background:var(--blue);min-width:2px;transition:width .3s}.bar .t{background:#edf0f5;border-radius:5px}
label.f{display:block;font-size:14px;color:var(--mut);margin-bottom:8px}label.f input[type=number]{display:block;width:100%;padding:8px;border:1.5px solid var(--line);border-radius:8px;font:inherit;color:var(--ink)}input[type=range]{width:100%}
.big{font-size:28px;font-weight:800}.stat{background:#f3f5f9;border-radius:12px;padding:10px;text-align:center}.stat span{display:block;font-size:13.5px;color:var(--mut)}
.wf{display:grid;grid-template-columns:200px 1fr 90px;gap:8px;align-items:center;font-size:14px;margin:4px 0}.wf .t{position:relative;height:16px;background:#edf0f5;border-radius:4px}.wf i{position:absolute;height:100%;border-radius:4px;background:var(--blue);min-width:2px}
@media(max-width:820px){.two,.three,.graph{grid-template-columns:1fr}.map{grid-template-columns:1fr 1fr}.gates{grid-template-columns:repeat(3,1fr)}.bar{grid-template-columns:1fr 90px}.bar .t{grid-column:1/3;grid-row:2}.wf{grid-template-columns:1fr 70px}.wf .t{grid-column:1/3;grid-row:2}.top h1{font-size:24px}}
</style>
</head>
<body>
<div class="top"><h1>🏁 Final Day: build an agent you can trust</h1><p>One small parts-desk agent, every topic. Each screen replays a <b>real recorded run</b> on a local llama3 model, shows the code that ran, and keeps the failures in.</p></div>
<nav id="nav" aria-label="Stations"></nav>
<main id="main"></main>
<script>
const D=/*__DATA__*/null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J=o=>esc(typeof o==='string'?o:JSON.stringify(o));
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const real='<span class="src">recorded real run</span>',scripted='<span class="src s">scripted model or input, real code</span>';
const code=(...names)=>'<details><summary>👩‍💻 The code that ran</summary>'+names.map(n=>`<div class="small mut">${esc(D.code[n].file)}</div><pre>${esc(D.code[n].code)}</pre>`).join('')+'</details>';
const like=t=>`<div class="like">💡 <b>Think of it like this:</b> ${t}</div>`,lesson=t=>`<div class="lesson">✅ <b>Take away:</b> ${t}</div>`;
const KIND={decide:['k-decide','🤔 Chose a tool'],result:['k-result','✅ Tool result'],tool_error:['k-bad','⛔ Tool refused'],args_blocked:['k-bad','🛡️ Invented argument blocked'],output_blocked:['k-bad','🛡️ Answer blocked'],no_evidence:['k-bad','🛡️ No evidence yet'],repeat:['k-warn','🔁 Same call again'],invalid_json:['k-bad','🧩 Wrong JSON shape'],approval_needed:['k-warn','🧑‍✈️ Needs a supervisor'],safe_mode:['k-warn','🔒 Safe mode stopped it'],approved:['k-result','✅ Supervisor approved']};
const ev=e=>{const{kind,...r}=e;const[c,l]=KIND[kind]||['',kind];return`<div class="step ${c}"><b>${l}</b><br><code>${J(r)}</code></div>`};
const playing={};
async function play(id,run,bad){const t=(playing[id]=(playing[id]||0)+1),el=$(id);el.innerHTML=`<div class="step"><b>❓ ${esc(run.question)}</b></div>`;for(const e of run.events){await sleep(600);if(playing[id]!==t)return;el.insertAdjacentHTML('beforeend',ev(e))}await sleep(500);if(playing[id]!==t)return;el.insertAdjacentHTML('beforeend',`<div class="ans ${bad?'bad':'good'}">${esc(run.answer)}</div><div class="small mut">Stopped: ${esc(run.stopped)} · ${run.llm_calls} model calls · ${run.tokens_in} tokens in, ${run.tokens_out} out</div>`)}
const S=[];const add=(id,nav,title,html,init)=>S.push({id,nav,title,html,init});
const E={v1:D.eval_v1,v2:D.eval_v2,v3:D.eval_v3};

/* 0 map */
add('map','🗺️ Map','Choose a station',`<div class="box"><h3>The parts desk</h3><p>A mechanic asks: <b>“N123AB has a defect. Which part does it need, and is it in stock at its station?”</b> A chatbot guesses. An <b>agent</b> uses tools to find out. Today you build one, break it, guard it, measure it, price it and run it.</p><div class="three"><div class="stat"><div class="big">${E.v1.dev.passed+E.v1['held-out'].passed}/22</div><span>first version passed</span></div><div class="stat"><div class="big">${E.v3.dev.passed+E.v3['held-out'].passed}/22</div><span>final version, same 22 cases</span></div><div class="stat"><div class="big">${E.v3.fresh.passed}/${E.v3.fresh.total}</div><span>final version, 8 new cases</span></div></div><p class="small mut">Aircraft, parts, stations and rates are fictional. Only 8 billion parameters, running on a laptop: a small model makes failures easy to see.</p></div><div class="box"><div class="map" id="mapgrid"></div></div>`,()=>{$('mapgrid').innerHTML=S.slice(1).map(s=>`<button data-go="${s.id}"><b>${s.nav}</b><span>${esc(s.title)}</span></button>`).join('')});

/* 1 tools */
const L1=D.lab1;
add('tools','🔧 Tool calling','Schema, validation, structured output',`${like('A tool is a form at a counter. The model fills in the form. Your code checks the form before anyone acts on it.')}
<div class="box"><h3>1. The form: your class becomes the schema</h3>${real}<pre>${J(JSON.stringify(L1.schema,null,1))}</pre>${code('custom_tool','registry')}</div>
<div class="box"><h3>2. Does the model support native tool calls?</h3>${real}<div class="ans bad">${esc(L1.native.error)}</div><p>So the kit asks for JSON in text, then checks it exactly like a native call:</p><div class="scroll"><table><tr><th>Question</th><th>What the model wrote</th><th>What the code returned</th></tr>${L1.fallback.map(r=>`<tr><td>${esc(r.q)}</td><td><code>${esc(r.raw)}</code></td><td><code>${J(r.result||r.error)}</code></td></tr>`).join('')}</table></div></div>
<div class="box"><h3>3. You are the validator: will this call run?</h3>${scripted}<div id="vq"></div></div>
<div class="box"><h3>4. Structured output: a note becomes an object</h3>${real}<p>“${esc(L1.structured.note)}”</p><pre>${J(JSON.stringify(L1.structured.attempts.at(-1).object,null,1))}</pre><p>Valid JSON, but read it again: is <b>low</b> the severity you would give low hydraulic pressure? <b>A schema checks the shape, not the judgement.</b></p>${code('execute')}</div>
${lesson('The model only asks. Code decides: allowlist, role, schema, approval, then run.')}`,()=>{let i=0;const draw=()=>{const v=L1.validation[i];$('vq').innerHTML=`<p><b>${i+1} of ${L1.validation.length}</b></p><pre>${J(v.tool+'('+JSON.stringify(v.arguments)+')')}</pre><button class="b" data-g>It runs</button><button class="b" data-g>It is stopped</button><div id="vr"></div>`;$('vq').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{$('vr').innerHTML=`<div class="ans bad">⛔ ${esc(v.why)}: ${esc(v.verdict)}</div><button class="b alt" id="vn">${i+1<L1.validation.length?'Next call':'Start again'}</button>`;$('vn').onclick=()=>{i=(i+1)%L1.validation.length;draw()}})};draw()});

/* 2 patterns */
const L2=D.lab2;
add('patterns','🔁 Agent patterns','Loop, planner-executor, stops, safe mode',`${like('A new employee with a phone. They call, listen, and call again. You must also teach them when to hang up.')}
<div class="box"><h3>1. Same question, two versions of the loop</h3>${real}<button class="b" id="pl">▶ Play both</button><div class="two"><div><h3>Version 1</h3><div id="p1"></div></div><div><h3>Version 3</h3><div id="p3"></div></div></div><p id="pwhy" hidden>Version 1 copied <b>FRA</b> from the example in its own prompt. N123AB is at <b>BLR</b>, where stock is <b>0</b>. Every number in the wrong answer was real, so a number check alone could not catch it. The fix was in code: an argument must come from the question or from an earlier result.</p>${code('arg_guard','loop')}</div>
<div class="box"><h3>2. Planner-executor: plan once, then follow the plan</h3>${real}<div class="two"><div><b>Model decides the order</b>${L2.planner_raw.done.map((d,i)=>`<div class="step ${d.result?'k-result':'k-bad'}">${i+1}. ${esc(d.step)}<br><code>${J(d.result||d.skipped)}</code></div>`).join('')}</div><div><b>Code decides the order</b>${L2.planner.done.map((d,i)=>`<div class="step ${d.result?'k-result':'k-bad'}">${i+1}. ${esc(d.step)}<br><code>${J(d.result||d.skipped)}</code></div>`).join('')}</div></div><p>The model chose the right tools in the wrong order. One model call is cheap, but dependencies belong in code.</p></div>
<div class="box"><h3>3. Make it misbehave: which brake stops it?</h3>${scripted}<div id="stops"></div><div id="stopout"></div></div>
<div class="box"><h3>4. Same write request, three outcomes</h3>${real}<div class="three"><div><b>🔒 Safe mode on</b><div class="ans">${esc(L2.safe_mode.answer)}</div></div><div><b>🧑‍🔧 Planner tries to approve</b><div class="ans bad">${esc(L2.planner_approves)}</div></div><div><b>🧑‍✈️ Supervisor approves</b><div class="ans good">${esc(L2.supervisor_approves.answer)}</div></div></div></div>
${lesson('An agent without stop rules is an open bill. Limit steps, tokens, repeats and writes.')}`,()=>{$('pl').onclick=()=>{$('pwhy').hidden=true;play('p1',L2.loop_v1,true);play('p3',L2.loop_v3).then(()=>$('pwhy').hidden=false)};$('stops').innerHTML=L2.stops.map((s,i)=>`<button class="b alt" data-i="${i}">${['😵 Never finishes','🦜 Repeats itself','💸 Burns tokens'][i]}</button>`).join('');$('stops').onclick=e=>{const b=e.target.closest('button');if(b){const s=L2.stops[b.dataset.i];play('stopout',{question:s.label+' test',events:s.events,answer:s.answer,stopped:s.stopped,llm_calls:'scripted',tokens_in:'-',tokens_out:'-'})}}});

/* 3 langgraph */
const L3=D.lab3;
add('graph','🕸️ LangGraph','State, routing, memory, human approval, teams',`${like('A board game. The state is the board, nodes are squares, edges are the rules, and the game can be paused and put away.')}
<div class="box"><h3>1. Choose an aircraft and watch the route</h3>${real}<div id="lgb"></div><div class="graph">${[['look_up','read aircraft'],['check_stock','read stock'],['approval','human decides'],['no_action','nothing to do'],['escalate','call the planner'],['end','finished']].map(([n,t])=>`<div class="node" id="n-${n}">${n}<small>${t}</small></div>`).join('')}</div><div id="lgo"></div></div>
<div class="box"><h3>2. Every save point of the approved run</h3>${real}<p>After the pause, the script closed the database, built a new graph and resumed. These checkpoints came from disk:</p><div>${L3.history.map(h=>`<span class="src">step ${h.step} → ${esc(h.next.join(', ')||'done')}</span> `).join('')}</div>${code('graph')}</div>
<div class="box"><h3>3. A team: one supervisor, two specialists, one writer</h3>${real}<button class="b" id="tb">▶ Play</button><div id="to"></div></div>
${lesson('Use a graph when the path matters: when you must branch, pause, resume or prove what happened. On resume, LangGraph re-runs the paused node from its start, so do nothing irreversible before interrupt().')}`,()=>{let token=0;$('lgb').innerHTML=L3.routes.map((r,i)=>`<button class="b" data-i="${i}">✈️ ${r.tail}</button>`).join('');const clear=()=>document.querySelectorAll('.node').forEach(n=>n.className='node');$('lgb').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const t=++token,r=L3.routes[b.dataset.i];clear();$('lgo').innerHTML='';for(const p of r.path){$('n-'+p).classList.add('hot');await sleep(800);if(t!==token)return;$('n-'+p).className='node done'}if(r.paused_at.length){$('n-approval').className='node wait';$('lgo').innerHTML=`<div class="ans">⏸️ Paused. It is asking: <code>${J(r.asking[0])}</code></div><button class="b alt" id="rs">💥 Restart the server</button> <button class="b" id="ok" disabled>🧑‍✈️ Supervisor approves</button>`;$('rs').onclick=async()=>{clear();$('rs').disabled=true;await sleep(900);if(t!==token)return;L3.after_restart.remembered.path.forEach(p=>$('n-'+p).className='node done');$('n-approval').className='node wait';$('ok').disabled=false;$('lgo').insertAdjacentHTML('beforeend',`<div class="ans">💾 Still waiting at <b>${esc(L3.after_restart.still_paused_at[0])}</b>. The state was read back from SQLite.</div>`)};$('ok').onclick=()=>{$('n-approval').className='node done';$('n-end').className='node done';$('ok').disabled=true;$('lgo').insertAdjacentHTML('beforeend',`<div class="ans good">${esc(L3.resumed.decision)}: <code>${J(L3.resumed.order)}</code></div>`)}}else{$('n-end').className='node done';$('lgo').innerHTML=`<div class="ans good">${esc(r.decision)}</div>`}};let tt=0;$('tb').onclick=async()=>{const t=++tt;$('to').innerHTML='';for(const l of L3.team.log){await sleep(650);if(t!==tt)return;$('to').insertAdjacentHTML('beforeend',`<div class="step ${l.startsWith('supervisor')?'k-decide':'k-result'}">${esc(l)}</div>`)}$('to').insertAdjacentHTML('beforeend',`<div class="ans">${esc(L3.team.summary)}</div><p class="small mut">Output check: ${L3.team.checks.length?esc(L3.team.checks.join('; ')):'no invented numbers'}. Look closely: the cost specialist found $4,500 and the writer left it out. Nothing false, but incomplete.</p>`)}});

/* 4 langchain */
const L4=D.lab4,L4f=D.lab4_first_try;
const lcRun=r=>r.error?`<div class="ans bad">Crashed: ${esc(r.error)}</div>`:r.steps.map(s=>`<div class="step ${s.type==='tool'?(/Error|exceeded/.test(s.text)?'k-bad':'k-result'):s.type==='ai'?'k-decide':''}"><b>${s.type}</b> <code>${J(s.tool_calls.length?s.tool_calls[0]:s.text)}</code></div>`).join('');
add('lc','🦜 LangChain','Use ready-made parts where they fit',`${like('A toolbox from a shop. The spanner is good. It does not know your aircraft.')}
<div class="box"><h3>1. Our functions become LangChain tools</h3><p>Tools offered: ${L4.tools.map(t=>`<span class="src">${esc(t)}</span>`).join(' ')}. The last is ready-made: a BM25 search turned into a tool in one line.</p>${code('wrap','create_agent')}</div>
<div class="box"><h3>2. The same question, before and after fixing the adapter</h3>${real}<div class="two"><div><b>First try</b>${lcRun(L4f.runs[0])}</div><div><b>After the fix</b>${lcRun(L4.runs[0])}</div></div><p>The first adapter hid the argument descriptions, so the model invented an aircraft. The framework worked. The information was missing.</p></div>
<div class="box"><h3>3. Still failing: “${esc(L4.runs[1].q)}”</h3>${real}${lcRun(L4.runs[1])}<p>The policy note says parts are <b>held</b> for 48 hours. The model searched for <b>holding time</b>. Word search found the wrong note, and then the agent wandered until LangChain’s limits stopped it. We left this one broken on purpose: what would you fix first?</p>${code('adapter')}</div>
${lesson('Use a framework for the wiring. You still own the descriptions, the search quality and the limits.')}`);

/* 5 mcp */
const MC=D.mcp_client;
add('mcp','🔌 MCP','Server, client, tools, resources, prompts',`${like('A USB port for AI. Build the plug once, and any MCP app can use it.')}
<div class="box"><h3>1. Who does what</h3><div class="three"><div class="stat"><b>🔧 Tools</b><span>actions: ${MC.tools.map(esc).join(', ')}</span></div><div class="stat"><b>📄 Resources</b><span>data to read: ${MC.resources.map(esc).join(', ')}</span></div><div class="stat"><b>📝 Prompts</b><span>templates: ${MC.prompts.map(esc).join(', ')}</span></div></div></div>
<div class="box"><h3>2. Listen to the real conversation</h3>${real}<p>No library on the client side: these are the raw messages. Click one to open it.</p><button class="b" id="mp">▶ Play</button><div class="lane"><b>💻 Client</b><b>🗄️ Server</b></div><div class="lane" id="ml"></div><pre id="mj" hidden></pre></div>
<div class="box"><h3>3. Three calls from a normal client</h3>${real}${MC.calls.map(c=>`<div class="step ${c.is_error?'k-bad':'k-result'}"><b>${esc(c.tool)}</b> <code>${J(c.args)}</code><br><code>${esc(c.text)}</code></div>`).join('')}<p>The server runs the same <code>execute()</code> checks, so a write is refused even if a client asks nicely.</p>${code('mcp_server','mcp_client')}</div>
<div class="box"><h3>4. Where companies use it</h3><p>One server for maintenance records, one for parts, one for policies. Each team owns its own server and its own checks, and every assistant reuses them. LangChain loaded this same server’s tools without new code: ${D.mcp_langchain.tools.map(t=>`<span class="src">${esc(t)}</span>`).join(' ')}</p><p class="small mut"><b>Version note:</b> our installed SDK speaks protocol ${esc(MC.protocol)}. On 24 November 2026 the <a href="https://modelcontextprotocol.io/specification/versioning.md" target="_blank" rel="noopener">MCP site</a> lists 2026-07-28 as current, which negotiates the version on every request. Check your SDK before copying the handshake.</p></div>
${lesson('MCP standardises the plug, not the trust. Identity, roles and approval are still your code.')}`,()=>{let t=0;$('mp').onclick=async()=>{const k=++t;$('ml').innerHTML='';for(const[i,m]of D.mcp_wire.entries()){await sleep(550);if(k!==t)return;const x=m.message,txt=x.method?x.method+(x.params?.name?': '+x.params.name:''):x.error?'❌ error '+x.error.code:x.result?.isError?'⛔ refused':x.result?.tools?x.result.tools.length+' tools':x.result?.serverInfo?'hello from '+x.result.serverInfo.name:'✅ result';$('ml').insertAdjacentHTML('beforeend',`<button class="msg ${m.from}" data-i="${i}">${esc(txt)}</button>`)}};$('ml').onclick=e=>{const b=e.target.closest('.msg');if(b){$('mj').hidden=false;$('mj').textContent=JSON.stringify(D.mcp_wire[b.dataset.i].message,null,1)}}});

<div class="box"><h3>What “AGP” means here</h3><p>This station teaches the <b>agent gateway pattern</b> with a short file of our own code. It is not the AGP protocol itself. The AGNTCY project’s Agent Gateway Protocol repository, <a href="https://github.com/agntcy/agp" target="_blank" rel="noopener">github.com/agntcy/agp</a>, now redirects to <b>SLIM</b> (Secure Low-Latency Interactive Messaging). Its <a href="https://datatracker.ietf.org/doc/draft-mpsb-agntcy-slim/" target="_blank" rel="noopener">IETF draft</a> describes a transport layer under agent protocols such as A2A and MCP. Checked 24 November 2026.</p><div class="scroll"><table><tr><th></th><th>Connects</th><th>Job</th></tr><tr><td><b>MCP</b></td><td>agent ↔ tools and data</td><td>a standard plug</td></tr><tr><td><b>A2A</b></td><td>agent ↔ agent</td><td>a standard conversation</td></tr><tr><td><b>SLIM (was AGP)</b></td><td>the messages underneath</td><td>secure transport</td></tr></table></div></div>
${lesson('The tampered message had a perfect shape and a real sender name. Only the signature caught it. Order your checks, and log every verdict.')}`,()=>{let t=0;$('gb').innerHTML=L6.tests.map((x,i)=>`<button class="b alt" data-i="${i}">${esc(x.label)}</button>`).join('');$('gb').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const k=++t,x=L6.tests[b.dataset.i],g=gateOf(x.verdict);GATES.forEach((_,i)=>$('g'+i).className='gate');$('go2').innerHTML='';for(let i=0;i<6;i++){await sleep(230);if(k!==t)return;if(i===g){$('g'+i).classList.add('stop');break}$('g'+i).classList.add('ok')}$('go2').innerHTML=`<div class="ans ${g<6?'bad':'good'}">${esc(x.verdict)} ${x.reply?`<code>${J(x.reply)}</code>`:''}</div>`}});

add('guard','🛡️ Guardrails','Stop the bad, let the good through',`${like('Seat belt, airbag and brakes. Each one is there because another one will fail.')}

${lesson('Compare cost per correct task, not price per token. And read the date on the price sheet.')}`,()=>{const draw=()=>{const n=+$('pt').value,c=+$('pc').value/100,b=$('pb').checked,after=$('pd').checked,ti=L9.per_task.tokens_in,to=L9.per_task.tokens_out;$('tv').textContent=n.toLocaleString();$('cv').textContent=Math.round(c*100)+'%'+(b&&c?' (not applied to batch here)':'');const f=PR.rows.map(r=>{let pi=r.input,po=r.output,pc=r.cached??r.input,m=1;if(after&&r.changes_on){m=r.input_after/r.input;pi=r.input_after;po=r.output_after;pc*=m}let x;if(b){x=r.batch_input==null?null:(ti*r.batch_input*m+to*r.batch_output*m)/1e6}else x=(ti*(1-c)*pi+ti*c*pc+to*po)/1e6;return{l:r.vendor+' · '+r.model,v:x==null?null:x*n*30}}).sort((p,q)=>(p.v??1e12)-(q.v??1e12));const mx=Math.max(...f.map(x=>x.v||0));$('pbars').innerHTML=f.map(x=>`<div class="bar"><span>${esc(x.l)}</span><div class="t"><i style="width:${x.v==null?0:100*x.v/mx}%"></i></div><b class="num">${x.v==null?'no batch price':'$'+x.v.toLocaleString(undefined,{maximumFractionDigits:0})+'/mo'}</b></div>`).join('')};['pt','pc','pb','pd'].forEach(i=>$(i).oninput=draw);draw()});

<div class="box"><h3>1. Better was also cheaper</h3>${real}<div class="scroll"><table><tr><th>Version</th><th class="num">Right, of the same 22</th><th class="num">Tokens for all 22</th><th class="num">Tokens per right answer</th></tr>${V.map(v=>`<tr><td><b>${v.version}</b></td><td class="num">${v.passed}</td><td class="num">${(v.tokens_in+v.tokens_out).toLocaleString()}</td><td class="num"><b>${Math.round((v.tokens_in+v.tokens_out)/v.passed).toLocaleString()}</b></td></tr>`).join('')}</table></div><p class="small mut">v3’s total includes held-out cases its fixes had already seen.</p></div>
